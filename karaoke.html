<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>کارائوکه ساز</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#222;--mut:#777;--ac:#d6336c;--bd:#e3ded3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17161a;--card:#222126;--tx:#eee;--mut:#9a98a0;--ac:#f06595;--bd:#35333b}}
:root[data-theme="dark"]{--bg:#17161a;--card:#222126;--tx:#eee;--mut:#9a98a0;--ac:#f06595;--bd:#35333b}
html{color-scheme:light dark;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,"Vazirmatn",system-ui,sans-serif;line-height:1.7}
main{max-width:480px;margin:0 auto;padding:20px 16px}
h1{font-size:1.5rem;margin:8px 0}
p.s{color:var(--mut);margin:0 0 16px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
label.f,.f{display:block;border:2px dashed var(--bd);border-radius:12px;padding:36px 22px;font-size:17px;text-align:center;cursor:pointer;touch-action:manipulation}
input[type=file]{display:none}
button{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:14px 18px;min-height:50px;width:100%;font:inherit;font-size:17px;touch-action:manipulation;-webkit-appearance:none;cursor:pointer}
button:disabled{opacity:.5}
audio{width:100%;margin-top:8px}
.r{display:flex;align-items:center;gap:10px;margin:12px 0;min-height:44px}
input[type=checkbox]{width:26px;height:26px;flex:none}
#st{color:var(--mut);margin-top:8px}
h3{margin:0;font-size:1rem}
h3{margin:0 0 6px}
.sm{width:auto;min-height:44px;padding:8px 14px;font-size:15px}
.bt{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.g{background:var(--bd);color:var(--tx)}
.nm{word-break:break-all;font-weight:bold}
.sub{color:var(--mut);font-size:.9rem}
#pw{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px))}
</style>
</head>
<body>
<main>
<h1>🎤 کارائوکه ساز</h1>
<p class="s">آهنگ‌هات رو یه بار اضافه کن، توی لیست خود برنامه می‌مونن. همه‌چیز روی دستگاه خودت انجام میشه و جایی آپلود نمیشه.</p>
<div class="c">
<label class="f" for="fi">➕ اضافه کردن آهنگ‌ها (چندتا با هم)</label>
<input type="file" id="fi" accept="audio/*" multiple>
<div class="r"><input type="checkbox" id="bass" checked><label for="bass">بیس رو نگه دار (کیفیت بهتر)</label></div>
<div style="margin:12px 0"><label for="amt">میزان حذف صدا: <b id="av">100</b>٪</label><input type="range" id="amt" min="0" max="100" value="100" style="width:100%;height:32px" oninput="av.textContent=this.value"></div>
<div id="st" class="sub"></div>
</div>
<div id="ls"></div>
</main>
<div id="pw" hidden><div id="pn" class="sub"></div><audio id="pl" controls></audio></div>
<script>
const $=id=>document.getElementById(id);
let db=null,songs=[],busy=false,pu=null;
const idb=()=>new Promise((res,rej)=>{try{const r=indexedDB.open('karaoke',1);r.onupgradeneeded=()=>r.result.createObjectStore('s',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej()}catch(e){rej(e)}});
const put=s=>db?new Promise(r=>{try{const t=db.transaction('s','readwrite');t.objectStore('s').put(s);t.oncomplete=r;t.onerror=r}catch(e){r()}}):0;
const del=id=>db?new Promise(r=>{try{const t=db.transaction('s','readwrite');t.objectStore('s').delete(id);t.oncomplete=r;t.onerror=r}catch(e){r()}}):0;
const all=()=>db?new Promise(r=>{try{const q=db.transaction('s').objectStore('s').getAll();q.onsuccess=()=>r(q.result);q.onerror=()=>r([])}catch(e){r([])}}):[];
const mk=(t,fn,cls)=>{const b=document.createElement('button');b.textContent=t;b.className='sm '+(cls||'');b.onclick=fn;return b};
function play(blob,name){
  if(pu)URL.revokeObjectURL(pu);pu=URL.createObjectURL(blob);
  $('pl').src=pu;$('pw').hidden=false;$('pn').textContent=name;$('pl').play().catch(()=>{});
}
function render(){
  const ls=$('ls');ls.innerHTML='';
  if(!songs.length){ls.innerHTML='<p class="sub" style="text-align:center">هنوز آهنگی اضافه نکردی.</p>';return}
  songs.forEach(s=>{
    const c=document.createElement('div');c.className='c';
    const n=document.createElement('div');n.className='nm';n.textContent=s.name;c.append(n);
    const t=document.createElement('div');t.className='sub';t.textContent=s.out?'کارائوکه آماده است ✅':'هنوز پردازش نشده';c.append(t);
    const bt=document.createElement('div');bt.className='bt';
    bt.append(mk('▶️ اصلی',()=>play(s.blob,s.name+' (اصلی)'),'g'));
    if(s.out){
      bt.append(mk('🎤 کارائوکه',()=>play(s.out,s.name+' (کارائوکه)')));
      const f=new File([s.out],s.name.replace(/\.[^.]+$/,'')+'-karaoke.wav',{type:'audio/wav'});
      if(navigator.canShare&&navigator.canShare({files:[f]}))bt.append(mk('📤 ذخیره',()=>navigator.share({files:[f]}).catch(()=>{}),'g'));
    }
    bt.append(mk(s.out?'🔁 دوباره':'✂️ حذف صدا',()=>run(s)));
    bt.append(mk('🗑️',async()=>{songs=songs.filter(x=>x!==s);await del(s.id);render()},'g'));
    c.append(bt);ls.append(c);
  });
}
$('fi').onchange=async e=>{
  for(const f of e.target.files){const s={id:Date.now()+Math.random(),name:f.name,blob:f,out:null};songs.push(s);await put(s)}
  e.target.value='';render();
};
async function run(s){
  if(busy)return;busy=true;const st=$('st');
  try{
    st.textContent='در حال خوندن '+s.name+' ...';
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const buf=await ctx.decodeAudioData(await s.blob.arrayBuffer());ctx.close();
    if(buf.numberOfChannels<2){st.textContent='این آهنگ مونو هست و این روش روش جواب نمیده.';busy=false;return}
    await new Promise(r=>setTimeout(r,30));
    s.out=await karaoke(buf,$('amt').value/100,$('bass').checked,p=>{st.textContent='در حال پردازش... '+p+'٪'});
    await put(s);st.textContent='تموم شد ✅';render();play(s.out,s.name+' (کارائوکه)');
  }catch(e){st.textContent='نشد: '+(e&&e.message?e.message:'این فایل خونده نشد.')}
  busy=false;
}
async function karaoke(buf,amt,keep,onp){
    const L=buf.getChannelData(0),R=buf.getChannelData(1),n=L.length,sr=buf.sampleRate;
    const N=2048,H=1024,e=4*amt,cut=keep?Math.ceil(150*N/sr):0;
    const win=new Float64Array(N),cs=new Float64Array(N),sn=new Float64Array(N),rev=new Uint16Array(N);
    for(let i=0;i<N;i++){win[i]=Math.sin(Math.PI*(i+.5)/N);cs[i]=Math.cos(2*Math.PI*i/N);sn[i]=Math.sin(2*Math.PI*i/N);let r=0;for(let b=0;b<11;b++)if(i>>b&1)r|=1<<(10-b);rev[i]=r}
    const fft=(re,im,inv)=>{
      for(let i=0;i<N;i++){const j=rev[i];if(j>i){let t=re[i];re[i]=re[j];re[j]=t;t=im[i];im[i]=im[j];im[j]=t}}
      for(let len=2;len<=N;len<<=1){const h=len>>1,sp=N/len;
        for(let i=0;i<N;i+=len)for(let j=0;j<h;j++){
          const wr=cs[j*sp],wi=inv?sn[j*sp]:-sn[j*sp],a=i+j,b=a+h;
          const xr=re[b]*wr-im[b]*wi,xi=re[b]*wi+im[b]*wr;
          re[b]=re[a]-xr;im[b]=im[a]-xi;re[a]+=xr;im[a]+=xi}}};
    const oL=new Float32Array(n),oR=new Float32Array(n),re=new Float64Array(N),im=new Float64Array(N),or=new Float64Array(N),oi=new Float64Array(N);
    let fr=0;
    for(let p=-H;p<n;p+=H){
      for(let i=0;i<N;i++){const j=p+i,ok=j>=0&&j<n;re[i]=ok?L[j]*win[i]:0;im[i]=ok?R[j]*win[i]:0}
      fft(re,im,false);
      for(let k=0;k<=N/2;k++){
        const k2=(N-k)%N,zr=re[k],zi=im[k],wr=re[k2],wi=-im[k2];
        const lr=(zr+wr)/2,li=(zi+wi)/2,rr=(zi-wi)/2,ri=-(zr-wr)/2;
        const c=Math.max(0,2*(lr*rr+li*ri)/(lr*lr+li*li+rr*rr+ri*ri+1e-12));
        const g=k<cut?1:Math.pow(1-c,e);
        const a=lr*g,b=li*g,c2=rr*g,d2=ri*g;
        or[k]=a-d2;oi[k]=b+c2;or[k2]=a+d2;oi[k2]=-b+c2;
      }
      fft(or,oi,true);
      for(let i=0;i<N;i++){const j=p+i;if(j>=0&&j<n){oL[j]+=or[i]/N*win[i];oR[j]+=oi[i]/N*win[i]}}
      if(++fr%300==0){onp(Math.min(99,Math.round(p/n*100)));await new Promise(r=>setTimeout(r,0))}
    }
    let pk=0;for(let i=0;i<n;i++){const m=Math.max(Math.abs(oL[i]),Math.abs(oR[i]));if(m>pk)pk=m}
    const gn=pk>0.95?0.95/pk:1;
    const wav=new ArrayBuffer(44+n*4),d=new DataView(wav);
    const w=(o,s)=>{for(let i=0;i<s.length;i++)d.setUint8(o+i,s.charCodeAt(i))};
    w(0,'RIFF');d.setUint32(4,36+n*4,true);w(8,'WAVEfmt ');d.setUint32(16,16,true);
    d.setUint16(20,1,true);d.setUint16(22,2,true);d.setUint32(24,sr,true);
    d.setUint32(28,sr*4,true);d.setUint16(32,4,true);d.setUint16(34,16,true);
    w(36,'data');d.setUint32(40,n*4,true);
    for(let i=0;i<n;i++){d.setInt16(44+i*4,Math.max(-1,Math.min(1,oL[i]*gn))*32767|0,true);d.setInt16(46+i*4,Math.max(-1,Math.min(1,oR[i]*gn))*32767|0,true)}
    return new Blob([wav],{type:'audio/wav'});
}
(async()=>{try{db=await idb()}catch(e){db=null}songs=await all();render()})();
</script>
</body>
</html>
